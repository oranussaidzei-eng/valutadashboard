{% extends "base.html" %}

{% block content %}
<h2>Valutaomvandlare</h2>
<p>Välj valutor och ange ett belopp för att omvandla pengar.</p>

<form action="/history" method="post">
  <div class="mb-3">
    <label for="fran_valuta" class="form-label">Från valuta</label>
    <select id="fran_valuta" name="fran_valuta" class="form-select">
      {% for valuta in ["SEK", "USD", "EUR", "TND", "AFN", "CDF"] %}
      <option value="{{ valuta }}">{{ valuta }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label for="till_valuta" class="form-label">Till valuta</label>
    <select id="till_valuta" name="till_valuta" class="form-select">
      {% for valuta in ["SEK", "USD", "EUR", "TND", "AFN", "CDF"] %}
      <option value="{{ valuta }}">{{ valuta }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label for="belopp" class="form-label">Belopp</label>
    <input id="belopp" name="belopp" type="number"
      min="0.01" step="0.01" required class="form-control">
  </div>

  <button type="submit" class="btn btn-primary">Omvandla</button>
</form>
{% endblock %}
