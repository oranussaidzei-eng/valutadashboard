{% extends "base.html" %}

{% block content %}
<h2>Valutaomvandlare</h2>
<p>Välj valutor och ange ett belopp för att omvandla pengar.</p>

<form action="/history" method="post">
  <div class="mb-3">
    <label for="from_currency" class="form-label">Från valuta</label>
    <select id="from_currency" name="from_currency" class="form-select">
      {% for currency in ["SEK", "USD", "EUR", "TND", "AFN", "CDF"] %}
      <option value="{{ currency }}">{{ currency }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label for="to_currency" class="form-label">Till valuta</label>
    <select id="to_currency" name="to_currency" class="form-select">
      {% for currency in ["SEK", "USD", "EUR", "TND", "AFN", "CDF"] %}
      <option value="{{ currency }}">{{ currency }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label for="amount" class="form-label">Belopp</label>
    <input id="amount" name="amount" type="number"
      min="0.01" step="0.01" required class="form-control">
  </div>

  <button type="submit" class="btn btn-primary">Omvandla</button>
</form>
{% endblock %}
